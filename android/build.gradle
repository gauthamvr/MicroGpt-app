// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// ─── Global minSdk bump ────────────────────────────────────────────────
// The on-device Stable Diffusion engines require minSdk 30. The
// Expo root project plugin defaults us to 24, so we override it here
// AFTER the plugin applies — this propagates to app/build.gradle (which
// reads rootProject.ext.minSdkVersion) and to every module using
// safeExtGet('minSdkVersion', …).
//
// Android 11 (API 30) was released September 2020. In 2026 it covers
// >95% of active devices, and any phone with the RAM budget to actually
// run 2-4 GB LLMs is almost certainly running Android 11+ already.
// ───────────────────────────────────────────────────────────────────────
rootProject.ext.minSdkVersion = 30
