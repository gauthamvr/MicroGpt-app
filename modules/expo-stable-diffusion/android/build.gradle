apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.stablediffusion'
version = '0.1.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'expo.modules.stablediffusion'
  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 34)
    compileSdkVersion safeExtGet('compileSdkVersion', 34)
    versionCode 1
    versionName '0.1.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17.toString()
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

  // No more llmedge. We ship our own sd-server binary (compiled from
  // leejet/stable-diffusion.cpp, MIT) as libsd-server.so in jniLibs/.
  // The Kotlin code communicates with it via HTTP on localhost.
}
